name: Verificar pacote PHP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer test
      - run: bash scripts/release/test-consumer.sh

  distribution:
    name: Validar SemVer e ZIP com vendor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Conferir o conteúdo da SDK com a tag de origem
        run: |
          tag=$(jq -r '.replace["argws/asaas-sdk-php"]' composer.json)
          git clone --quiet --depth 1 --branch "v$tag" https://github.com/wkarts/asaas-sdk-argws.git "$RUNNER_TEMP/asaas"
          python3 scripts/release/sync-asaas.py "$RUNNER_TEMP/asaas" --check
      - run: python3 scripts/release/test_version.py
      - run: bash scripts/release/package.sh v0.0.0
