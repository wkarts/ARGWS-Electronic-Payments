name: Atualizar SDK Asaas interna
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: atualizar-sdk-asaas
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  sincronizar:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none
      - name: Buscar a última tag estável e preparar a cópia interna
        id: sdk
        run: |
          git clone --quiet --filter=blob:none --no-checkout https://github.com/wkarts/asaas-sdk-argws.git "$RUNNER_TEMP/asaas"
          tag=$(python3 scripts/release/sync-asaas.py "$RUNNER_TEMP/asaas")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- composer.json; then exit 0; fi
          composer update --lock --no-dev --no-scripts --no-plugins --no-interaction --no-progress
          composer dump-autoload --optimize --no-dev --no-scripts --no-plugins
          git add -- composer.json composer.lock vendor/composer vendor/autoload.php
          git add -f -- vendor/argws/asaas-sdk-php
          echo 'atualizar=true' >> "$GITHUB_OUTPUT"
      - name: Abrir ou retomar PR da versão
        if: steps.sdk.outputs.atualizar == 'true'
        id: pr
        env:
          TAG: ${{ steps.sdk.outputs.tag }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          branch="build/asaas-sdk-$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git switch -c "$branch"
          git commit -m "build(asaas): incorpora a SDK $TAG"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            git fetch --quiet origin "$branch"
            # Uma reexecução só pode promover o conteúdo que acaba de ser preparado.
            git diff --quiet HEAD FETCH_HEAD -- composer.json composer.lock vendor
            git diff --quiet origin/main FETCH_HEAD -- . ':!composer.json' ':!composer.lock' ':!vendor'
            sha=$(git rev-parse FETCH_HEAD)
          else
            git push origin "HEAD:refs/heads/$branch"
            sha=$(git rev-parse HEAD)
          fi
          pr=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [[ -z "$pr" ]]; then
            echo "Atualiza a SDK interna para $TAG e verifica a instalação no consumidor antes de publicar." > "$RUNNER_TEMP/pr.md"
            gh pr create --base main --head "$branch" --title "build(asaas): incorpora a SDK $TAG" --body-file "$RUNNER_TEMP/pr.md"
            pr=$(gh pr view "$branch" --json number --jq .number)
          fi
          echo "numero=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Validar o commit e publicar pelo fluxo da main
        if: steps.sdk.outputs.atualizar == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          TOKEN_PERSONALIZADO: ${{ secrets.RELEASE_TOKEN != '' }}
          BRANCH: ${{ steps.pr.outputs.branch }}
          SHA: ${{ steps.pr.outputs.sha }}
          PR: ${{ steps.pr.outputs.numero }}
        run: |
          gh workflow run php.yml --ref "$BRANCH"
          for tentativa in {1..30}; do
            run=$(gh run list --workflow php.yml --branch "$BRANCH" --event workflow_dispatch --commit "$SHA" --json databaseId --jq '.[0].databaseId')
            [[ -n "$run" ]] && break
            sleep 5
          done
          test -n "$run"
          gh run watch "$run" --interval 10 --exit-status
          gh pr merge "$PR" --squash --match-head-commit "$SHA"
          if [[ "$TOKEN_PERSONALIZADO" != 'true' ]]; then
            gh workflow run php.yml --ref main
          fi
